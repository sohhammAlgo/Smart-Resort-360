apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: smart-resort-360
data:
  ENV: "production"
  REDIS_URL: "redis://redis:6379/0"
  KAFKA_ENABLED: "true"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  RUN_SCHEDULER: "true"
  AMENITY_OFFER_TTL_SECONDS: "90"
  AMENITY_AGING_RATE_PER_MINUTE: "1.0"
  NOTIFICATION_ACK_WINDOW_SECONDS: "60"
  RISK_WEIGHT_SERVICE_OVERDUE: "0.30"
  RISK_WEIGHT_ASSET_AGE: "0.20"
  RISK_WEIGHT_USAGE: "0.20"
  RISK_WEIGHT_PREVIOUS_FAILURES: "0.20"
  RISK_WEIGHT_COMPLAINTS: "0.10"
  RISK_LOW_THRESHOLD: "0.35"
  RISK_HIGH_THRESHOLD: "0.65"
  MAINTENANCE_EVAL_INTERVAL_MINUTES: "60"
  CHROMA_PERSIST_DIR: "/data/chroma"
  LLM_PROVIDER: "mock"
  VOICE_PROVIDER: "mock"
